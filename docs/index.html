<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CRUD Dogs</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#333;padding:20px;min-height:100vh;}
    h1{color:white;text-shadow:2px 2px 4px rgba(0,0,0,0.3);margin-bottom:30px;}
    form{max-width:400px;margin:0 auto 30px;background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3);}
    input{width:100%;padding:15px;margin:10px 0;border:2px solid #ddd;border-radius:10px;font-size:16px;}
    input:focus{outline:none;border-color:#667eea;box-shadow:0 0 10px rgba(102,126,234,0.3);}
    button{width:100%;padding:15px;background:#667eea;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px;transition:background 0.3s;}
    button:hover{background:#5a67d8;}
    #list{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:1200px;margin:0 auto;}
    .card{background:white;padding:25px;border-radius:20px;width:250px;box-shadow:0 10px 30px rgba(0,0,0,0.2);transition:transform 0.3s;}
    .card:hover{transform:translateY(-5px);box-shadow:0 15px 40px rgba(0,0,0,0.3);}
    .card h3{margin:0 0 15px 0;color:#333;font-size:24px;}
    .card p{margin:10px 0;color:#666;font-size:18px;}
    .btn{width:48%;padding:12px;margin:5px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;color:white;}
    .delete{background:#e53e3e;}
    .delete:hover{background:#c53030;}
    .edit{background:#38a169;}
    .edit:hover{background:#2f855a;}
    .empty{padding:40px;color:#999;}
  </style>
</head>
<body>
  <h1>CRUD Cachorros</h1>
  
  <form id="form">
    <input type="number" id="age" placeholder="Idade do cachorro" min="0" required>
    <input type="text" id="name" placeholder="Nome do cachorro" required>
    <button type="submit">Salvar</button>
  </form>

  <div id="list" class="empty">Nenhum cachorro cadastrado</div>

  <script>
    let dogs = JSON.parse(localStorage.getItem('dogs')) || [];
    let editId = null;

    function saveDogs() {
      localStorage.setItem('dogs', JSON.stringify(dogs));
    }

    function renderDogs() {
      const list = document.getElementById('list');
      if (dogs.length === 0) {
        list.innerHTML = '<div class="empty">Nenhum cachorro cadastrado</div>';
        return;
      }
      
      list.innerHTML = dogs.map((dog, index) => `
        <div class="card">
          <h3>${dog.name}</h3>
          <p>Idade: ${dog.age} ano${dog.age > 1 ? 's' : ''}</p>
          <button class="btn delete" data-id="${index}">Deletar</button>
          <button class="btn edit" data-id="${index}">Editar</button>
        </div>
      `).join('');
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const age = parseInt(document.getElementById('age').value);
      const name = document.getElementById('name').value.trim();

      if (editId !== null) {
        // Editar
        dogs[editId] = { age, name };
        editId = null;
      } else {
        // Criar novo
        dogs.push({ age, name, id: Date.now() });
      }

      saveDogs();
      document.getElementById('form').reset();
      renderDogs();
    });

    document.getElementById('list').addEventListener('click', (e) => {
      const id = parseInt(e.target.dataset.id);

      if (e.target.classList.contains('delete')) {
        if (confirm('Deletar este cachorro?')) {
          dogs.splice(id, 1);
          saveDogs();
          renderDogs();
        }
      }

      if (e.target.classList.contains('edit')) {
        const dog = dogs[id];
        document.getElementById('age').value = dog.age;
        document.getElementById('name').value = dog.name;
        editId = id;
      }
    });

    // Carrega lista
    renderDogs();
  </script>
</body>
</html>
